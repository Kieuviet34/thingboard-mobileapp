name: thingsboard_democloud_app
description: Flutter ThingsBoard DemoCloud Mobile Application (UI Replica)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  google_fonts: ^6.3.2
  go_router: ^17.0.0
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  reactive_forms: ^18.2.2
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  toastification: ^2.3.0
  collection: ^1.19.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.2.0
  jwt_decoder: ^2.0.1
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  stream_channel: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
