name: thingsboard_democloud_app
description: Flutter ThingsBoard DemoCloud Mobile Application (UI Replica)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  google_fonts: ^6.3.2
  go_router: ^17.0.0
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  reactive_forms: ^18.2.2
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  toastification: ^2.3.0
  collection: ^1.19.1
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
