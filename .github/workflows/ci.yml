name: CI

on:
  push:
    branches: [main, dmhoang]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the version used locally (`flutter --version`).
  FLUTTER_VERSION: "3.50.0"

jobs:
  static:
    name: Format, analyze, tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (info-level issues fail the build)
        run: flutter analyze --fatal-infos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile QA/contract tooling
        run: python -I -m py_compile tools/api_contract/*.py tools/qa/*.py

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests (unit, widget, API contract) with coverage
        run: flutter test --coverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce coverage floors
        run: >
          python -I tools/qa/check_coverage.py
          --min 80
          --floor lib/core/api=80
          --floor lib/widgets=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Build Android debug APK
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
